name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      INTERVIEW_SIM_HOME: ${{ github.workspace }}/.test-data
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Backend tests
        run: python -m tests.run_tests
      - name: Frontend syntax and runtime tests
        run: |
          for file in frontend/*.js; do node --check "$file"; done
          node --test tests/test_audio_runtime.cjs tests/test_voice_runtime.cjs tests/test_report_runtime.cjs
      - name: Build distribution
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Browser acceptance with synthetic data
        if: matrix.python == '3.12'
        run: |
          python -m playwright install --with-deps chromium
          python -m tests.run_browser
      - name: Audit locked runtime and developer dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip_audit -r requirements.txt --disable-pip --no-deps
          python -m pip_audit -r requirements-dev.txt --disable-pip --no-deps
