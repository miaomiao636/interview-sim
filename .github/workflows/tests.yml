name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INTERVIEW_SIM_HOME: /tmp/interview-sim-test-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install application and test dependencies
        run: python -m pip install -e . httpx
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: Frontend syntax and audio tests
        run: |
          for file in frontend/*.js; do node --check "$file"; done
          node --test tests/test_audio_runtime.cjs tests/test_voice_runtime.cjs
      - name: Build distribution
        run: python -m pip wheel --no-deps . --wheel-dir dist
